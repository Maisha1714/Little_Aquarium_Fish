<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Reef Aquarium</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b3b4a;--sea:#0b6a73;--coral:#d64530;--card:#fff;--sand:#fff4d6;--bubble:#d7f3f1;--sun:#ffc83d;--bg1:#bfeeee;--bg2:#0e7c86;--line:rgba(11,59,74,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e6f6f7;--sea:#7fd0d6;--coral:#e8603f;--card:#12303a;--sand:#1c3f4a;--bubble:#1f4a55;--bg1:#0a2630;--bg2:#05141a;--line:rgba(230,246,247,.25)}}
:root[data-theme="dark"]{--ink:#e6f6f7;--sea:#7fd0d6;--coral:#e8603f;--card:#12303a;--sand:#1c3f4a;--bubble:#1f4a55;--bg1:#0a2630;--bg2:#05141a;--line:rgba(230,246,247,.25)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;font:18px/1.5 Nunito,system-ui,sans-serif;color:var(--ink);background:#052b36;overflow-x:hidden}
h1,h2,h3,button,.tab{font-family:Fredoka,"Trebuchet MS",sans-serif}
.hero{position:relative;height:100svh;min-height:600px;overflow:hidden;background:linear-gradient(#2bb3c8 0,#1689a0 25%,#0b5563 65%,#073a47 100%);color:#fff;text-align:center}
.rays{position:absolute;inset:0;background:repeating-linear-gradient(105deg,#fff0 0 90px,#ffffff14 90px 150px);mask-image:linear-gradient(#000,#0000 70%);-webkit-mask-image:linear-gradient(#000,#0000 70%);animation:sway 9s ease-in-out infinite alternate}
@keyframes sway{to{transform:translateX(40px)}}
.hero-text{position:absolute;z-index:2;left:0;right:0;top:11%;padding:0 18px;pointer-events:none}
.hero h1{font-size:clamp(2.6rem,9vw,5.2rem);margin:0;line-height:1.05;text-shadow:0 3px 0 #0b556388}
.hero p{font-size:clamp(1.1rem,3vw,1.5rem);margin:10px auto 18px;max-width:30ch;text-shadow:0 2px 6px #0007}
.hero .btn{pointer-events:auto;font-size:1.2rem;padding:12px 28px;box-shadow:0 4px 0 #8a2415}
.sw{position:absolute;left:0;z-index:1;background:none;border:0;padding:0;cursor:pointer;animation-timing-function:linear;animation-iteration-count:infinite}
.sw.l{animation-name:ltr}.sw.r{animation-name:rtl}
@keyframes ltr{from{transform:translateX(-120%)}to{transform:translateX(calc(100vw + 20%))}}
@keyframes rtl{from{transform:translateX(calc(100vw + 20%))}to{transform:translateX(-120%)}}
.fl{display:block;animation:bob 3.4s ease-in-out infinite}
.sw svg{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 6px #0004)}
.sw.r svg{transform:scaleX(-1)}
.lab{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:#fff;color:#0b3b4a;font:700 .95rem Fredoka,sans-serif;padding:2px 12px;border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.sw:hover .lab,.sw:focus-visible .lab,.sw.named .lab{opacity:1}
.bub{position:absolute;bottom:-20px;border-radius:50%;border:2px solid #ffffffaa;background:#ffffff33;animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh)}}
.floor{position:absolute;left:0;right:0;bottom:0;width:100%;height:150px;z-index:2;pointer-events:none}
.weed{transform-origin:50% 100%;animation:wave 4s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.toast{position:absolute;z-index:3;left:50%;bottom:150px;transform:translateX(-50%);background:#fff;color:#0b3b4a;border-radius:20px;padding:10px 18px;max-width:min(92vw,460px);box-shadow:0 4px 14px #0005}
main{max-width:1080px;margin:0 auto;padding:28px 16px 64px;color:#fff}
.card{color:var(--ink)}
.tabs{display:flex;justify-content:center;gap:6px;background:var(--card);padding:6px;border-radius:999px;width:fit-content;margin:0 auto 22px;box-shadow:0 2px 8px #0003;max-width:100%;overflow-x:auto}
.tab{border:0;background:none;color:var(--ink);font-size:1.05rem;font-weight:700;padding:9px 18px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{background:var(--coral);color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.btn{font-weight:700;font-size:1rem;border-radius:999px;border:2px solid var(--ink);background:var(--card);color:var(--ink);padding:9px 18px;cursor:pointer}
.btn.on,.btn.go{background:var(--coral);border-color:var(--coral);color:#fff}
.btn:active{transform:scale(.96)}
.btn:disabled{cursor:default}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:9px 18px}
textarea{border-radius:18px;height:90px}
.bar{display:flex;gap:10px;flex-wrap:wrap;max-width:700px;margin:0 auto}
.bar input{flex:1 1 220px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));margin-top:22px}
.card{background:var(--card);border-radius:26px;box-shadow:0 3px 10px #0003;overflow:hidden}
.pic{position:relative;overflow:hidden;height:150px;display:grid;place-items:center;width:100%;border:0;cursor:pointer;background:repeating-linear-gradient(100deg,#fff0 0 30px,#ffffff33 30px 60px),linear-gradient(#c9f1f7,#79cfe0);background-size:120px 100%,100% 100%;animation:shim 6s linear infinite}
@keyframes shim{to{background-position:120px 0,0 0}}
.pic svg{height:100%;width:78%;filter:drop-shadow(0 6px 5px #0b3b4a44);transition:scale .25s;animation:glide 9s ease-in-out infinite,bobY 2.6s ease-in-out infinite,wob 1.1s ease-in-out infinite}
@keyframes glide{0%{transform:translateX(-14%) scaleX(1)}44%{transform:translateX(14%) scaleX(1)}50%{transform:translateX(14%) scaleX(-1)}94%{transform:translateX(-14%) scaleX(-1)}100%{transform:translateX(-14%) scaleX(1)}}
@keyframes bobY{50%{translate:0 -7px}}
@keyframes wob{0%,100%{rotate:-3deg}50%{rotate:3deg}}
.pic::before,.pic::after{content:"";position:absolute;bottom:-14px;border-radius:50%;border:2px solid #ffffffcc;background:#ffffff44;animation:rise2 4s linear infinite;pointer-events:none}
.pic::before{left:12%;width:11px;height:11px}
.pic::after{left:82%;width:7px;height:7px;animation-duration:5.5s;animation-delay:-2s}
@keyframes rise2{to{transform:translateY(-180px)}}
.pic:hover svg,.pic:focus-visible svg{scale:1.14}
.pic[aria-expanded=true] svg{scale:1.2}
.grid .card:nth-child(3n+2) .pic svg{animation-delay:-3s,-1s,-.4s}
.grid .card:nth-child(3n) .pic svg{animation-delay:-6s,-1.8s,-.8s}
.grid .card:nth-child(2n) .pic::before{animation-delay:-1.5s}
.body{padding:14px 18px 18px}
.body h3{margin:0;font-size:1.5rem}
.bn{color:var(--sea)}
.badge{display:inline-block;background:var(--bubble);border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:800;margin:4px 0}
dl{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;background:var(--sand);border-radius:16px;padding:12px;margin:10px 0 0}
dt{font-weight:800}dd{margin:0}
.hint{font-size:.9rem;color:var(--sea);margin:6px 0 0}
.panel{max-width:640px;margin:0 auto;padding:22px;text-align:center}
.panel.left{text-align:left;max-width:700px}
.big{height:170px;border-radius:24px;padding:10px;margin:10px 0;background:linear-gradient(#c9f1f7,#79cfe0)}.big svg{height:100%;width:100%;animation:bobY 2.6s ease-in-out infinite,wob 1.4s ease-in-out infinite}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:12px}
.opts .btn{padding:14px}
.ok{background:#bfe8c6!important;color:#0b3b1b!important;border-color:#2f8f4a!important}
.no{background:#ffd3cc!important;color:#5a1409!important}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px}
.q{margin:16px 0}
.msg{font-weight:800;margin:4px 0 0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media print{body{background:#fff;color:#000}main{color:#000}.noprint,.hero{display:none!important}.card{box-shadow:none;border:1px solid #000}}
</style></head><body>
<header class="hero noprint" id="hero"><div class="rays"></div>
<div class="hero-text"><h1>Little Reef Aquarium</h1><p>Tap a fish to meet it!</p><button class="btn go" id="start">Start exploring</button></div>
<div id="tank"></div><div class="toast" id="toast" role="status" hidden></div>
<svg class="floor" viewBox="0 0 1200 150" preserveAspectRatio="none" aria-hidden="true"><g class="weed" style="transform-origin:150px 150px"><path d="M140 150 Q110 100 145 60 Q120 100 160 150Z M165 150 Q190 90 170 40 Q205 95 185 150Z" fill="#2f9e5b"/></g><g class="weed" style="transform-origin:900px 150px;animation-delay:-2s"><path d="M880 150 Q850 90 890 50 Q870 100 905 150Z M910 150 Q945 100 925 55 Q960 105 935 150Z" fill="#3fb06a"/></g><g class="weed" style="transform-origin:560px 150px;animation-delay:-1s"><path d="M545 150 Q520 110 550 75 Q540 115 570 150Z" fill="#2f9e5b"/></g><path d="M0 150V105Q150 80 300 105T600 100T900 108T1200 95V150Z" fill="#e8c987"/><circle cx="330" cy="125" r="10" fill="#d9b06a"/><circle cx="740" cy="130" r="7" fill="#d9b06a"/><path d="M1010 128 q15-30 30 0z" fill="#ff7f6b"/></svg></header>
<main id="top">
<div class="tabs noprint" role="tablist" id="tabs"></div>
<section id="explore"></section><section id="quiz" hidden></section><section id="homework" hidden></section>
</main>
<script>
const FISH=[
{id:"clownfish",name:"Clownfish",e:"🐠",c:"#ff9d3d",w:"Saltwater",home:"coral reef",food:"plankton",size:"10 cm",clue:"I am orange with white stripes and I hide in a sea anemone.",fact:"Lives safely inside a sea anemone’s stinging arms."},
{id:"goldfish",name:"Goldfish",e:"🐟",c:"#ffb703",w:"Freshwater",home:"pond",food:"plants",size:"20 cm",clue:"I am shiny gold and I am a popular pet.",fact:"Can remember things for months."},
{id:"pufferfish",name:"Pufferfish",e:"🐡",c:"#e9c46a",w:"Saltwater",home:"warm ocean",food:"snails",size:"30 cm",clue:"I puff up like a ball when I am scared.",fact:"Puffs up by swallowing water."},
{id:"shark",name:"Great White Shark",e:"🦈",c:"#8aa1b1",w:"Saltwater",home:"open ocean",food:"seals",size:"5 m",clue:"I have a big fin and rows of sharp teeth.",fact:"Grows thousands of teeth in its life."},
{id:"betta",name:"Betta",e:"🐟",c:"#e63946",w:"Freshwater",home:"rice paddy",food:"insects",size:"7 cm",clue:"I have long flowing fins and I build bubble nests.",fact:"Males build nests out of bubbles."},
{id:"angelfish",name:"Angelfish",e:"🐠",c:"#90be6d",w:"Freshwater",home:"river",food:"small worms",size:"15 cm",clue:"My body is tall and flat like a triangle.",fact:"Its flat body helps it hide between plants."},
{id:"seahorse",name:"Seahorse",e:"🐴",c:"#f4a261",w:"Saltwater",home:"seagrass",food:"tiny shrimp",size:"12 cm",clue:"I look like a tiny horse and my dad carries my babies.",fact:"The dad carries the babies in his pouch."},
{id:"hilsa",name:"Hilsa",bn:"ইলিশ",e:"🐟",c:"#b8c0cc",w:"Freshwater",home:"river",food:"plankton",size:"50 cm",clue:"I am silver and I am the national fish of Bangladesh.",fact:"It is the national fish of Bangladesh."},
{id:"rohu",name:"Rohu",bn:"রুই",e:"🐟",c:"#a8dadc",w:"Freshwater",home:"pond",food:"plants",size:"60 cm",clue:"Farmers raise me in village ponds.",fact:"Farmers in Bangladesh raise rohu in village ponds."},
{id:"eel",name:"Electric Eel",e:"🐍",c:"#6a994e",w:"Freshwater",home:"river",food:"fish",size:"2 m",clue:"I look like a snake and I make electricity.",fact:"Makes electricity to stun its dinner."}];
const $=s=>document.querySelector(s), sh=a=>[...a].sort(()=>Math.random()-.5);
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||"{}")}catch{return {}}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const ART={clownfish:["fish","#ff8a1f","#e65a00"],goldfish:["fancy","#ffb703","#ff7b00"],pufferfish:["puffer","#f2d46b","#d9a93a"],shark:["shark","#8aa1b1","#5f7686"],betta:["betta","#e63946","#7b2cbf"],angelfish:["angel","#f3e9a8","#2a2a2a"],seahorse:["horse","#f4a261","#d4732a"],hilsa:["slim","#d5dde8","#8c9bb0"],rohu:["slim","#a9bb8b","#e07a5f"],eel:["eel","#6a994e","#3d5a2a"]};
const eye=(x,y,r=8)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="${x+2}" cy="${y}" r="${r*.5}" fill="#111"/><circle cx="${x+3.5}" cy="${y-2}" r="${r*.18}" fill="#fff"/>`;
function fishSVG(f){
 const [t,c,d]=ART[f.id], k="cp"+f.id, o='stroke="#222" stroke-width="3" stroke-linejoin="round"';let g="";
 if(t=="fish")g=`<clipPath id="${k}"><ellipse cx="100" cy="65" rx="64" ry="40"/></clipPath><path d="M44 65 L8 34 Q20 65 8 96Z" fill="${d}" ${o}/><path d="M70 28 Q100 4 140 32Z" fill="${d}" ${o}/><ellipse cx="100" cy="65" rx="64" ry="40" fill="${c}" ${o}/><g clip-path="url(#${k})" fill="#fff" stroke="#222" stroke-width="3"><rect x="78" y="20" width="15" height="90"/><rect x="128" y="20" width="10" height="90"/></g><ellipse cx="96" cy="80" rx="14" ry="8" fill="${d}" ${o} transform="rotate(25 96 80)"/>${eye(146,55)}<path d="M156 78 q8 5 14 0" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/>`;
 else if(t=="fancy")g=`<path d="M58 65 Q8 8 4 42 Q22 65 4 90 Q8 122 58 65Z" fill="${d}" ${o}/><path d="M80 30 Q110 0 140 30Z" fill="${d}" ${o}/><ellipse cx="108" cy="65" rx="54" ry="40" fill="${c}" ${o}/><path d="M90 70 Q110 88 126 74" fill="none" stroke="#fff" stroke-width="4" opacity=".6" stroke-linecap="round"/><ellipse cx="102" cy="86" rx="14" ry="9" fill="${d}" ${o} transform="rotate(25 102 86)"/>${eye(138,54)}<path d="M150 74 q6 4 10 0" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/>`;
 else if(t=="puffer"){let sp="";for(let i=0;i<14;i++){const a=i/14*6.283,x=105+Math.cos(a)*47,y=65+Math.sin(a)*47;sp+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="${d}"/>`}
  g=`<path d="M52 65 L22 44 Q30 65 22 86Z" fill="${d}" ${o}/>${sp}<circle cx="105" cy="65" r="48" fill="${c}" ${o}/><ellipse cx="108" cy="88" rx="32" ry="14" fill="#fff8d6"/><ellipse cx="98" cy="70" rx="12" ry="9" fill="${d}" ${o}/>${eye(132,50,10)}<ellipse cx="152" cy="68" rx="6" ry="8" fill="#e76f51" ${o}/>`}
 else if(t=="shark")g=`<path d="M8 22 L52 62 L10 108 Q30 66 8 22Z" fill="${d}" ${o}/><path d="M92 40 L116 6 L136 46Z" fill="${d}" ${o}/><path d="M38 64 Q90 28 160 50 Q192 62 196 72 Q150 100 90 92 Q60 88 38 64Z" fill="${c}" ${o}/><path d="M64 84 Q120 100 188 76 Q150 92 90 91Z" fill="#fff"/><path d="M112 82 L130 108 L138 82Z" fill="${d}" ${o}/><path d="M118 56 q-4 8 0 14 M126 55 q-4 8 0 14" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>${eye(166,62,6)}<path d="M170 78 q12 8 24 -2" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/><path d="M178 77l3 6 3-6M186 75l3 6 3-6" fill="#fff" stroke="#222" stroke-width="1.5"/>`;
 else if(t=="betta")g=`<path d="M98 65 Q40 0 4 20 Q30 65 4 110 Q40 128 98 65Z" fill="${d}" opacity=".9" ${o}/><path d="M110 42 Q140 0 172 24 Q150 36 150 44Z" fill="${d}" ${o}/><path d="M110 88 Q130 124 160 116 Q146 98 146 86Z" fill="${d}" ${o}/><ellipse cx="132" cy="65" rx="42" ry="26" fill="${c}" ${o}/>${eye(152,58,7)}<path d="M164 72 q6 3 10 0" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/>`;
 else if(t=="angel")g=`<clipPath id="${k}"><ellipse cx="102" cy="65" rx="36" ry="38"/></clipPath><path d="M70 65 L34 40 Q46 65 34 90Z" fill="${c}" ${o}/><path d="M86 32 Q96 2 112 -2 Q106 18 120 34Z" fill="${c}" ${o}/><path d="M86 98 Q96 128 112 132 Q106 112 120 96Z" fill="${c}" ${o}/><ellipse cx="102" cy="65" rx="36" ry="38" fill="${c}" ${o}/><g clip-path="url(#${k})" fill="${d}"><rect x="90" y="20" width="8" height="90"/><rect x="108" y="20" width="8" height="90"/></g>${eye(124,54,7)}<path d="M132 78 q5 3 9 0" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/>`;
 else if(t=="horse")g=`<path d="M112 52 C150 70 128 100 108 108 C90 118 104 130 124 124" fill="none" stroke="${d}" stroke-width="30" stroke-linecap="round"/><path d="M112 52 C150 70 128 100 108 108 C90 118 104 130 124 124" fill="none" stroke="${c}" stroke-width="22" stroke-linecap="round"/><ellipse cx="146" cy="82" rx="8" ry="16" fill="${d}" ${o} transform="rotate(-20 146 82)"/><circle cx="108" cy="36" r="22" fill="${c}" ${o}/><rect x="120" y="32" width="48" height="12" rx="6" fill="${c}" ${o}/><path d="M92 20 l-8 -12 l16 6 l2 -14 l10 12" fill="${d}" ${o}/>${eye(112,32,6)}<path d="M96 58 h30 M100 70 h30 M104 82 h26" stroke="${d}" stroke-width="3" stroke-linecap="round" opacity=".7"/>`;
 else if(t=="slim"){let sc="";for(let r=0;r<3;r++)for(let i=0;i<6;i++)sc+=`<path d="M${70+i*16+(r%2)*8} ${50+r*14} q8 7 0 14" fill="none" stroke="${d}" stroke-width="2" opacity=".6"/>`;
  g=`<path d="M52 65 L8 28 Q22 65 8 102Z" fill="${d}" ${o}/><path d="M98 38 L120 14 L132 42Z" fill="${d}" ${o}/><path d="M44 65 Q100 14 172 52 Q194 65 172 78 Q100 116 44 65Z" fill="${c}" ${o}/>${sc}<path d="M150 50 Q140 65 150 80" fill="none" stroke="#222" stroke-width="2.5"/>${eye(166,60,6)}<ellipse cx="108" cy="86" rx="14" ry="6" fill="${d}" ${o}/>`}
 else g=`<path d="M12 84 C40 24 74 112 104 66 S160 28 184 58" fill="none" stroke="#222" stroke-width="32" stroke-linecap="round"/><path d="M12 84 C40 24 74 112 104 66 S160 28 184 58" fill="none" stroke="${c}" stroke-width="26" stroke-linecap="round"/><path d="M12 90 C40 30 74 118 104 72 S160 34 184 64" fill="none" stroke="#f2c14e" stroke-width="7" stroke-linecap="round" opacity=".8"/>${eye(186,52,7)}<path d="M180 70 q8 3 14 -1" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/><path d="M60 30 l6 -12 l6 12M120 80 l6 12 l6 -12" fill="#ffe66d" stroke="#222" stroke-width="2.5"/>`;
 return `<svg viewBox="0 0 200 130" role="img" aria-label="Cartoon ${f.name}">${g}</svg>`}
/* tabs */
const TABS=[["explore","Meet the fish"],["quiz","Name quiz"],["homework","Homework"]];
const tabs=$("#tabs");
TABS.forEach(([id,l])=>{const b=document.createElement("button");b.className="tab";b.role="tab";b.textContent=l;b.dataset.id=id;b.onclick=()=>show(id);tabs.append(b)});
function show(id){TABS.forEach(([t])=>$("#"+t).hidden=t!==id);tabs.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.id===id))}
/* explore */
let q="",water="All",open=null;
$("#explore").innerHTML=`<div class="bar"><input type="text" id="q" aria-label="Search fish" placeholder="Find a fish by name…"><span id="wf" style="display:flex;gap:8px;flex-wrap:wrap"></span></div><div class="grid" id="grid"></div>`;
["All","Freshwater","Saltwater"].forEach(w=>{const b=document.createElement("button");b.className="btn";b.textContent=w;b.onclick=()=>{water=w;drawGrid()};$("#wf").append(b)});
$("#q").oninput=e=>{q=e.target.value;drawGrid()};
function drawGrid(){
 $("#wf").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.textContent===water));
 const l=FISH.filter(f=>(water==="All"||f.w===water)&&(f.name+(f.bn||"")).toLowerCase().includes(q.toLowerCase()));
 $("#grid").innerHTML=l.length?l.map(f=>`<article class="card"><button class="pic" data-id="${f.id}" aria-expanded="${open===f.id}" aria-label="Show details for ${f.name}">${fishSVG(f)}</button><div class="body"><h3>${f.name} ${f.bn?`<span class="bn">(${f.bn})</span>`:""}</h3><span class="badge">${f.w}</span><p style="margin:4px 0">💡 ${f.fact}</p>${open===f.id?`<dl><dt>Lives in</dt><dd>${f.home}</dd><dt>Eats</dt><dd>${f.food}</dd><dt>Size</dt><dd>${f.size}</dd></dl>`:`<p class="hint">Tap the picture to learn more</p>`}</div></article>`).join(""):`<p style="grid-column:1/-1;text-align:center;font-size:1.2rem">No fish found. Try a different name!</p>`;
 $("#grid").querySelectorAll(".pic").forEach(b=>b.onclick=()=>{open=open===b.dataset.id?null:b.dataset.id;drawGrid();$("#grid").querySelector(`[data-id="${open}"]`)?.focus()});
}
/* quiz */
let deck,round,score,pick;
function newDeck(){deck=sh(FISH).slice(0,5).map(f=>({f,o:sh([f,...sh(FISH.filter(x=>x.id!==f.id)).slice(0,3)])}));round=0;score=0;pick=null;drawQuiz()}
function drawQuiz(){
 const el=$("#quiz");
 if(round>=deck.length){el.innerHTML=`<div class="card panel"><div style="font-size:4rem">${score>=4?"🏆":"🌊"}</div><h2>You got ${score} out of ${deck.length}!</h2><button class="btn go" id="again">Play again</button></div>`;$("#again").onclick=newDeck;return}
 const {f,o}=deck[round];
 el.innerHTML=`<div class="card panel"><b class="bn">Question ${round+1} of ${deck.length}</b><div class="big">${fishSVG(f)}</div><h2 style="margin:0">“${f.clue}”</h2><p style="margin:4px 0">Which fish am I?</p><div class="opts">${o.map(x=>`<button class="btn ${pick?(x.id===f.id?"ok":x.id===pick?"no":""):""}" data-id="${x.id}" ${pick?"disabled":""}>${x.name}</button>`).join("")}</div>${pick?`<p class="msg" role="status">${pick===f.id?"Yes! 🎉":"Nice try! It was the "+f.name+"."}</p><button class="btn go" id="next">Next fish</button>`:""}</div>`;
 el.querySelectorAll(".opts .btn").forEach(b=>b.onclick=()=>{pick=b.dataset.id;if(pick===f.id)score++;drawQuiz();$("#next").focus()});

/* homework */
let hid=FISH[0].id;
function drawHW(){
 const f=FISH.find(x=>x.id===hid),key="hw-"+hid,a=store.get(key);
 const qs=[["home",`The ${f.name} lives in a ____.`,f.home],["food",`The ${f.name} eats ____.`,f.food],["size","It grows to about ____.",f.size]];
 $("#homework").innerHTML=`<div class="row noprint">${FISH.map(x=>`<button class="btn ${x.id===hid?"on":""}" data-id="${x.id}">${x.name}</button>`).join("")}</div>
 <div class="card panel left"><div style="height:90px;width:140px">${fishSVG(f)}</div><h2 style="margin:0">Homework: ${f.name}</h2><p>Name: <input type="text" id="hn" aria-label="Your name" style="width:220px"></p>
 ${qs.map((x,i)=>`<div class="q"><label>${i+1}. ${x[1]}<input type="text" id="a-${x[0]}"></label><p class="msg" id="r-${x[0]}" role="status"></p></div>`).join("")}
 <div class="q"><label>4. Write one cool thing about the ${f.name}:<textarea id="a-note"></textarea></label></div>
 <div class="noprint"><button class="btn go" id="chk">Check my answers</button> <button class="btn" id="prt">Print homework</button> <b id="sc" style="margin-left:8px"></b></div></div>`;
 const ids={name:"#hn",home:"#a-home",food:"#a-food",size:"#a-size",note:"#a-note"};
 for(const k in ids){const i=$(ids[k]);i.value=a[k]||"";i.oninput=()=>{a[k]=i.value;store.set(key,a)}}
 $("#chk").onclick=()=>{let n=0;qs.forEach(x=>{const ok=(a[x[0]]||"").trim().toLowerCase()===x[2].toLowerCase();if(ok)n++;$("#r-"+x[0]).textContent=ok?"✅ Correct!":`❌ Hint: open the ${f.name} card in Meet the fish.`});$("#sc").textContent=`${n}/3 correct ${n===3?"🌟":""}`};
 $("#prt").onclick=()=>window.print();
 $("#homework").querySelectorAll(".row .btn").forEach(b=>b.onclick=()=>{hid=b.dataset.id;drawHW()});
}

let tt;
TANK.forEach(([id,w,top,dur,dl,dir])=>{const f=FISH.find(x=>x.id===id),b=document.createElement("button");b.className="sw "+dir;b.style.cssText=`width:${w}px;top:${top}%;animation-duration:${dur}s;animation-delay:${dl}s`;b.setAttribute("aria-label","Meet the "+f.name);
 b.innerHTML=`<span class="fl">${fishSVG(f)}</span><span class="lab">${f.name}${f.bn?" ("+f.bn+")":""}</span>`;
 b.onclick=()=>{document.querySelectorAll(".sw.named").forEach(x=>x.classList.remove("named"));b.classList.add("named");const t=$("#toast");t.hidden=false;t.innerHTML=`<b>${f.name}${f.bn?" ("+f.bn+")":""}</b> — ${f.fact} <button class="btn go" style="padding:3px 14px;margin-left:6px" id="see">See card</button>`;$("#see").onclick=()=>{q="";$("#q").value="";water="All";open=f.id;drawGrid();show("explore");$("#top").scrollIntoView({behavior:"smooth"});setTimeout(()=>document.querySelector(`.pic[data-id="${f.id}"]`)?.scrollIntoView({block:"center",behavior:"smooth"}),500)};clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true;b.classList.remove("named")},6000)};
 $("#tank").append(b)});
for(let i=0;i<16;i++){const e=document.createElement("span"),z=6+Math.random()*16;e.className="bub";e.style.cssText=`left:${Math.random()*100}%;width:${z}px;height:${z}px;animation-duration:${8+Math.random()*10}s;animation-delay:-${Math.random()*14}s`;$("#hero").append(e)}
$("#start").onclick=()=>$("#top").scrollIntoView({behavior:"smooth"});
drawGrid();newDeck();drawHW();show("explore");
